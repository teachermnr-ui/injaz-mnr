<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملف الإنجاز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .record-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .record-row:last-child { border-bottom:none; }
</style>
</head>
<body>
  <header class="app-header">
    <h1>ملف الإنجاز</h1>
  </header>

  <main class="container">

    <div class="card">
      <h3 style="margin-top:0">اختر الفصل والطالب</h3>
      <label>الفصل</label>
      <select id="classSelect">
        <option value="">اختر فصل...</option>
      </select>
      <br><br>
      <label>الطالب</label>
      <select id="studentSelect" disabled>
        <option value="">اختر طالب...</option>
      </select>
    </div>

    <div class="card" id="recordCard" style="display:none;">
      <h3 style="margin-top:0">سجل: <span id="recordStudentName"></span></h3>
      <div id="recordList"></div>
    </div>

  </main>

  <script type="module">
    import { db } from "../shared/firebase-config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const statusLabels = {
      "not-started": "لم يبدأ",
      "in-progress": "جاري",
      "submitted": "مُسلّم",
      "corrected": "مُصحح"
    };

    let worksheetTitleMap = {};

    async function loadClasses() {
      const snap = await getDocs(collection(db, "classes"));
      const sel = document.getElementById("classSelect");
      snap.docs.forEach((d) => {
        const c = d.data();
        const periodLabel = c.period === "first" ? "الفترة الأولى" : "الفترة الثانية";
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = c.name ? `${c.code} - ${c.name} (${periodLabel})` : `${c.code} (${periodLabel})`;
        sel.appendChild(opt);
      });
    }

    document.getElementById("classSelect").addEventListener("change", async (e) => {
      const studentSel = document.getElementById("studentSelect");
      studentSel.innerHTML = `<option value="">اختر طالب...</option>`;
      studentSel.disabled = true;
      document.getElementById("recordCard").style.display = "none";

      if (!e.target.value) return;

      const q = query(collection(db, "students"), where("currentClassId", "==", e.target.value));
      const snap = await getDocs(q);
      snap.docs.forEach((d) => {
        const s = d.data();
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = s.name;
        studentSel.appendChild(opt);
      });
      studentSel.disabled = false;
    });

    document.getElementById("studentSelect").addEventListener("change", async (e) => {
      if (!e.target.value) {
        document.getElementById("recordCard").style.display = "none";
        return;
      }
      await loadRecord(e.target.value, e.target.options[e.target.selectedIndex].textContent);
    });

    async function loadRecord(studentId, studentName) {
      document.getElementById("recordStudentName").textContent = studentName;
      document.getElementById("recordCard").style.display = "block";
      const listEl = document.getElementById("recordList");
      listEl.innerHTML = "جاري التحميل...";

      if (Object.keys(worksheetTitleMap).length === 0) {
        const wSnap = await getDocs(collection(db, "worksheets"));
        wSnap.docs.forEach((d) => { worksheetTitleMap[d.id] = d.data().title; });
      }

      const q = query(collection(db, "submissions"), where("studentId", "==", studentId));
      const snap = await getDocs(q);

      if (snap.empty) {
        listEl.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);">لسه مفيش أي تسليمات لهذا الطالب.</p>`;
        return;
      }

      const records = snap.docs.map((d) => d.data()).sort((a, b) => {
        const ta = a.submittedAt ? a.submittedAt.seconds : 0;
        const tb = b.submittedAt ? b.submittedAt.seconds : 0;
        return tb - ta;
      });

      listEl.innerHTML = "";
      records.forEach((r) => {
        const row = document.createElement("div");
        row.className = "record-row";
        row.innerHTML = `
          <div>
            <p style="margin:0;font-weight:500;font-size:14px;">${worksheetTitleMap[r.worksheetId] || "ورقة محذوفة"}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--ink-soft);">${r.totalScore || ""}</p>
          </div>
          <span class="status-pill status-${r.status}">${statusLabels[r.status] || r.status}</span>
        `;
        listEl.appendChild(row);
      });
    }

    loadClasses();
  </script>
</body>
</html>
