<!DOCTYPE html>
<!-- إصدار: 2026-10-20.1 — الإشعارات والمساءلات: ما وصل الموظف (نماذج للتوقيع/الاطلاع)، وللمدير ما ينتظر اعتماده، ولصاحب صلاحية وكيل الشؤون المدرسية اعتمادات المدير -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>الإشعارات والمساءلات</title>
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="users-api.js"></script>
<script src="form-header.js?v=2026-10-16.4"></script>
<script src="staff-docs.js?v=2026-10-20.1"></script>
<script src="sem-guard.js?v=2026-10-14.5"></script>
<script src="dash-base.js?v=2026-10-20.1"></script>
<script>
const {esc, arN, stat} = Dash;
Dash.boot({
  title:'الإشعارات والمساءلات',
  allow:()=>true,
  render: async env=>{
    const {db, sid, me, isSA, period} = env;
    const perm = (env.ctx && env.ctx.permissions && env.ctx.permissions['tools.agentSchool']) || {};
    const isAgent = !isSA && !!(perm.access || perm.edit);
    const sdCol = db.collection('staffDocs').doc(sid).collection('items');
    const base = db.collection('schoolAffairs').doc(sid);
    const dateOf = ms=>{ try{ return new Date(ms).toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } };
    const safe = p=>p.then(s=>s.docs.map(d=>({id:d.id,...d.data()}))).catch(e=>{ console.warn(e); return []; });
    let PCTX = null;
    const printCtx = async ()=> PCTX || (PCTX = await FormHdr.resolve({db, session:env.session, period}));

    env.main.innerHTML = '<div id="nSumm"></div><div id="nMgr"></div><div id="nMine"></div><div id="nAgent"></div><div id="nView"></div>';
    const $ = s=>document.querySelector(s);

    async function load(){
      const [mine, decs, mts] = await Promise.all([
        safe(sdCol.where('empId','==',me.id).get()),
        isSA || isAgent ? safe(base.collection('decisions').get()) : Promise.resolve([]),
        isSA || isAgent ? safe(base.collection('maint').get()) : Promise.resolve([])
      ]);
      mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      const unsigned = mine.filter(d=>d.status==='sent');
      const waitDec = decs.filter(d=>d.st==='wait'), waitMt = mts.filter(m=>m.l==='wait');
      $('#nSumm').innerHTML = '<div class="dh-stats">'
        + stat('نماذج بانتظار توقيعي أو اطلاعي', arN(unsigned.length), '#nMine', unsigned.length?'bad':'')
        + (isSA ? stat('قرارات حسم بانتظار اعتمادي', arN(waitDec.length), 'school-affairs.html#c', waitDec.length?'bad':'')
                + stat('خطابات صيانة بانتظار اعتمادي', arN(waitMt.length), 'school-affairs.html#m', waitMt.length?'warn':'') : '')
        + '</div>';
      /* المدير: ما ينتظر اعتماده */
      $('#nMgr').innerHTML = isSA ? '<div class="dh-card"><h3>بانتظار اعتمادي</h3>'
        + (waitDec.length || waitMt.length ? '<div class="dh-list">'
          + waitDec.map(d=>'<div class="dh-item"><div>قرار حسم: '+esc(d.empName||'')+'<div class="m">'+esc(d.why||'')+'</div></div><a class="dh-link" href="school-affairs.html#c">فتح قرارات الحسم</a></div>').join('')
          + waitMt.map(m=>'<div class="dh-item"><div>خطاب طلب صيانة: '+esc(m.loc||'')+'<div class="m">'+esc(m.d||'')+'</div></div><a class="dh-link" href="school-affairs.html#m">فتح الصيانة</a></div>').join('')
          + '</div>' : '<div class="dh-empty">لا شيء بانتظار اعتمادك.</div>') + '</div>' : '';
      /* ما وصلني */
      $('#nMine').innerHTML = '<div class="dh-card" id="nMineCard"><h3>ما وصلني</h3>'
        + (mine.length ? '<div class="dh-list">' + mine.map(d=>{
            const s = d.status==='signed';
            const need = d.needSign ? 'يحتاج توقيعك' : 'يحتاج تأكيد اطلاعك';
            return '<div class="dh-item"><div>'+esc(d.title)+'<div class="m">'+esc(d.dateText||'')+' · '+arN(d.minutes||0)+' دقيقة</div></div>'
              + '<div><span class="dh-chip '+(s?'':'bad')+'">'+(s?(d.needSign?'وقّعتُ':'أكّدتُ الاطلاع'):need)+'</span> <button class="dh-link" data-open="'+esc(d.id)+'">'+(s?'عرض':'فتح')+'</button></div></div>';
          }).join('') + '</div>' : '<div class="dh-empty">لا نماذج واردة إليك.</div>') + '</div>';
      /* صاحب صلاحية وكيل الشؤون المدرسية: اعتمادات المدير */
      if(isAgent){
        const ap = []
          .concat(mts.filter(m=>m.l==='ok'||m.l==='no').map(m=>({t:m.lAt||0, h:(m.l==='ok'?'اعتمد المدير خطاب طلب الصيانة: ':'لم يعتمد المدير خطاب طلب الصيانة: ')+esc(m.loc||''), bad:m.l==='no'})))
          .concat(decs.filter(d=>d.st==='ok'||d.st==='sent').map(d=>({t:d.approvedAt||0, h:'اعتمد المدير قرار الحسم: '+esc(d.empName||'')+(d.days!==''&&d.days!=null?' ('+arN(d.days)+' يوم)':''), bad:false})))
          .sort((a,b)=>b.t-a.t).slice(0,20);
        $('#nAgent').innerHTML = '<div class="dh-card"><h3>اعتمادات المدير</h3>' + (ap.length ? '<div class="dh-list">'+ap.map(x=>'<div class="dh-item"><div>'+x.h+'<div class="m">'+esc(x.t?dateOf(x.t):'')+'</div></div><span class="dh-chip '+(x.bad?'bad':'')+'">'+(x.bad?'لم يُعتمد':'معتمد')+'</span></div>').join('')+'</div>' : '<div class="dh-empty">لا اعتمادات بعد.</div>') + '</div>';
      }
      $('#nMineCard').onclick = ev=>{
        const b = ev.target.closest('[data-open]'); if(!b) return;
        openDoc(mine.find(x=>x.id===b.dataset.open));
      };
    }

    async function openDoc(d){
      if(!d) return;
      const c = await printCtx();
      const v = $('#nView');
      v.innerHTML = '<div class="dh-card"><h3>'+esc(d.title)+'</h3><div id="nDoc"></div><div id="nPad"></div><div class="dh-links" id="nAct" style="margin-top:10px"></div></div>';
      $('#nDoc').innerHTML = StaffDocs.html(d, c);
      const act = $('#nAct');
      const printBtn = '<button class="dh-link" id="nPrint">طباعة</button><button class="dh-link" id="nClose">إغلاق</button>';
      if(d.status==='sent'){
        act.innerHTML = (d.needSign ? '<button class="dh-link" id="nSign" style="background:#0f766e;color:#fff">أوقّع بإصبعي</button>' : '<button class="dh-link" id="nAck" style="background:#0f766e;color:#fff">أؤكد اطلاعي</button>') + printBtn;
      }else act.innerHTML = printBtn;
      const done = async patch=>{
        try{ await sdCol.doc(d.id).update(Object.assign({status:'signed', signedAt:Date.now()}, patch)); v.innerHTML=''; await load(); }
        catch(e){ console.error(e); alert('تعذّر الحفظ: '+(e.message||e)); }
      };
      if($('#nSign')) $('#nSign').onclick = ()=>{ act.innerHTML=''; StaffDocs.signPad($('#nPad'), img=>done({signature:img}), ()=>openDoc(d)); };
      if($('#nAck')) $('#nAck').onclick = ()=>done({});
      $('#nPrint').onclick = ()=>StaffDocs.print(d, c);
      $('#nClose').onclick = ()=>{ v.innerHTML=''; };
      v.scrollIntoView({behavior:'smooth'});
    }
    await load();
  }
});
</script>
</body>
</html>
