<!DOCTYPE html>
<!-- إصدار: 2026-10-15.1 -->
<!-- [ADMIN-TOOLS] صفحة مستقلة بالكامل — تُحذف عند إزالة الأدوات الإدارية (انظر ADMIN-TOOLS-LOG.md) -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>الوكلاء</title>
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="nav-back.js?v=2026-10-28.1" defer></script>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="sem-guard.js?v=2026-10-14.5"></script>
<script src="dash-base.js?v=2026-10-15.1"></script>
<script>
const {esc, arN, dk, dayLabel, stat, link} = Dash;
Dash.boot({
  title:'الوكلاء',
  allow:(u,ctx)=> (ctx && ctx.role==='agent') ? true : 'هذه الصفحة لدور الوكيل فقط.',
  render: async env=>{
    const {db, sid, me, period} = env, today = dk(new Date());
    const safe = p=>p.then(s=>s.docs.map(d=>({id:d.id,...d.data()}))).catch(()=>[]);
    const [att, notices, appts, notes, duty, visits, thrSnap] = await Promise.all([
      safe(db.collection('attendance').where('schoolId','==',sid).get()),
      safe(db.collection('absNotices').where('schoolId','==',sid).get()),
      safe(db.collection('guidanceAppointments').where('byUserId','==',me.id).get()),
      safe(db.collection('notes').where('recipients','array-contains',me.id).get()),
      safe(db.collection('dutyPlans').where('schoolId','==',sid).get()),
      safe(db.collection('classVisits').where('schoolId','==',sid).get()),
      db.collection('absNotices').doc('settings_'+sid).get().catch(()=>null)
    ]);
    /* الحضور والغياب */
    const A = att.filter(a=>a.period===period);
    const todayAbs = A.filter(a=>a.date===today && a.status==='absent').length;
    const todayLate = A.filter(a=>a.date===today && a.status==='late').length;
    const thr = (thrSnap && thrSnap.exists && +thrSnap.data().threshold>0) ? +thrSnap.data().threshold : 5;
    const by = {};
    A.filter(a=>a.status==='absent').forEach(a=>{ const k=String(a.seat); const s=by[k]=by[k]||{seat:k,name:a.name||'',cls:a.className||a.classCode||'',dates:new Set()}; s.dates.add(a.date); });
    const notified = new Set(notices.filter(n=>n.kind==='notice' && n.period===period).map(n=>String(n.seat)));
    const over = Object.values(by).map(s=>({...s,days:s.dates.size})).filter(s=>s.days>=thr).sort((a,b)=>b.days-a.days);
    const pending = over.filter(s=>!notified.has(s.seat));
    /* المواعيد */
    const myAppts = appts.filter(a=>a.period===period && a.status==='scheduled' && a.date>=today).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
    const apptsToday = myAppts.filter(a=>a.date===today).length;
    /* التحويلات الواردة غير المقروءة */
    const lastAct = n=>Math.max(n.createdAt||0, ...(n.replies||[]).map(r=>r.at||0), 0);
    const unread = notes.filter(n=>n.period===period && !n.closed && lastAct(n) > ((n.readAt && n.readAt[me.id])||0)).length;
    /* المناوبة والإشراف */
    const plans = duty.filter(p=>p.period===period && p.kind==='plan');
    /* الزيارات الصفية */
    const vp = visits.filter(v=>v.period===period && v.kind==='plan');
    const upVisits = [];
    vp.forEach(v=>[v.v1,v.v2].forEach(x=>{ if(x && x.date && x.date>=today) upVisits.push({date:x.date,name:v.teacherName||'',cls:x.cls||''}); }));
    upVisits.sort((a,b)=>a.date.localeCompare(b.date));
    env.main.innerHTML =
      '<div class="dh-stats">'
      + stat('غائبون اليوم', arN(todayAbs), 'index.html?tab=absence', todayAbs?'warn':'')
      + stat('متأخرون اليوم', arN(todayLate), 'index.html?tab=absence')
      + stat('بلغوا حد الغياب ('+arN(thr)+' أيام)', arN(over.length), 'index.html?tab=absence', over.length?'warn':'')
      + stat('بانتظار إشعار ولي الأمر', arN(pending.length), 'index.html?tab=absence', pending.length?'bad':'')
      + stat('تحويلات واردة جديدة', arN(unread), 'index.html?tab=received', unread?'warn':'')
      + stat('مواعيد اليوم', arN(apptsToday), 'index.html', '')
      + '</div>'
      + '<div class="dh-grid">'
      + '<section class="dh-card"><h3>طلاب بلغوا حد الغياب</h3>'
        + (over.length ? '<div class="dh-list">'+over.slice(0,10).map(s=>'<div class="dh-item"><span><b>'+esc(s.name)+'</b> <span class="m">'+esc(s.cls)+'</span></span><span>'+(notified.has(s.seat)?'<span class="dh-chip">أُشعر وليّ الأمر</span>':'<span class="dh-chip bad">لم يُشعَر</span>')+' <span class="dh-chip warn">'+arN(s.days)+' أيام</span></span></div>').join('')+'</div>'
            + (over.length>10?'<div class="dh-sub" style="margin-top:6px">و'+arN(over.length-10)+' آخرون في صفحة «تأخر وغياب الطلاب».</div>':'')
          : '<div class="dh-empty">لا يوجد طالب بلغ حد الغياب هذا الفصل.</div>')
        + '<div class="dh-links" style="margin-top:10px">'+link('index.html?tab=absence','🕘 تأخر وغياب الطلاب')+'</div></section>'
      + '<section class="dh-card"><h3>مواعيد أولياء الأمور القادمة</h3>'
        + (myAppts.length ? '<div class="dh-list">'+myAppts.slice(0,8).map(a=>'<div class="dh-item"><span><b>'+esc(a.name)+'</b> <span class="m">'+esc(a.reason||'')+'</span></span><span class="dh-chip'+(a.date===today?' warn':'')+'">'+esc(a.date===today?'اليوم':dayLabel(a.date))+(a.time?' · '+esc(a.time):'')+'</span></div>').join('')+'</div>'
          : '<div class="dh-empty">لا توجد مواعيد قادمة.</div>')
        + '<div class="dh-links" style="margin-top:10px">'+link('index.html','🗓️ مواعيدي (من لوحتي)')+'</div></section>'
      + '</div>'
      + '<div class="dh-grid">'
      + '<section class="dh-card"><h3>المناوبة والإشراف</h3>'
        + (plans.length ? '<div class="dh-list">'+plans.map(p=>'<div class="dh-item"><span><b>'+esc(p.stageLabel||p.stage||'')+'</b></span><span class="dh-chip'+(p.pub?'':' warn')+'">'+(p.pub?'معتمدة ومعمّمة':'لم تُعتمد بعد')+'</span></div>').join('')+'</div>'
          : '<div class="dh-empty">لم تُنشأ خطة مناوبة لهذا الفصل.</div>')
        + '<div class="dh-links" style="margin-top:10px">'+link('duty.html','🛡️ المناوبة والإشراف')+'</div></section>'
      + '<section class="dh-card"><h3>الزيارات الصفية</h3>'
        + '<div class="dh-sub" style="margin-bottom:6px">عدد المعلمين الموضوعة لهم خطة: '+arN(vp.length)+'</div>'
        + (upVisits.length ? '<div class="dh-list">'+upVisits.slice(0,6).map(v=>'<div class="dh-item"><span><b>'+esc(v.name)+'</b> <span class="m">'+esc(v.cls)+'</span></span><span class="dh-chip">'+esc(dayLabel(v.date))+'</span></div>').join('')+'</div>'
          : '<div class="dh-empty">لا توجد زيارات قادمة مجدولة.</div>')
        + '<div class="dh-links" style="margin-top:10px">'+link('visits.html','👁 الزيارات الصفية')+'</div></section>'
      + '</div>'
      + '<section class="dh-card"><h3>روابط سريعة</h3><div class="dh-links">'
        + link('index.html?tab=received','📥 التحويلات الواردة')+link('index.html?tab=sent','📤 التحويلات المرسلة')
        + link('circulars.html','✍️ التعاميم')+link('timetable.html?sec=waiting','⏳ حصص الانتظار')+link('holidays.html','🏖️ الإجازات')
      + '</div></section>';
  }
});
</script>
</body>
</html>
