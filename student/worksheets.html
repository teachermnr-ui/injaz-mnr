<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أوراقي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .ws-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .ws-card:active { background:var(--paper); }
  .ws-list-row { background:#fff; border-bottom:1px solid var(--line); padding:10px 4px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .ws-list-row:active { background:var(--paper); }
</style>
</head>
<body>
  <header class="app-header">
    <h1>أوراقي</h1>
    <span id="studentNameLabel" style="font-size:13px;"></span>
  </header>

  <main class="container">
    <div id="notLoggedIn" class="card" style="display:none;">
      <p>لازم تسجّل دخولك الأول.</p>
      <a href="login.html" class="btn btn-primary" style="display:inline-block;text-decoration:none;">تسجيل الدخول</a>
    </div>

    <div id="worksheetsWrap"></div>
  </main>

  <script type="module">
    import { db } from "../shared/firebase-config.js";
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const studentId = sessionStorage.getItem("studentId");
    const studentName = sessionStorage.getItem("studentName");
    const studentClassId = sessionStorage.getItem("studentClassId");

    if (!studentId) {
      document.getElementById("notLoggedIn").style.display = "block";
    } else {
      document.getElementById("studentNameLabel").textContent = studentName;
      loadWorksheets();
    }

    const statusLabels = {
      "not-started": "لم يبدأ",
      "in-progress": "جاري",
      "submitted": "مُسلّم",
      "corrected": "مُصحح"
    };

    async function loadWorksheets() {
      const wrap = document.getElementById("worksheetsWrap");
      wrap.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);">جاري التحميل...</p>`;

      const settingSnap = await getDoc(doc(db, "settings", "display"));
      const viewMode = settingSnap.exists() ? settingSnap.data().worksheetView : "cards";

      const wq = query(
        collection(db, "worksheets"),
        where("status", "==", "published"),
        where("assignedClassIds", "array-contains", studentClassId)
      );
      const wSnap = await getDocs(wq);

      const sq = query(collection(db, "submissions"), where("studentId", "==", studentId));
      const sSnap = await getDocs(sq);
      const submissionByWorksheet = {};
      sSnap.docs.forEach((d) => { submissionByWorksheet[d.data().worksheetId] = { id: d.id, ...d.data() }; });

      if (wSnap.empty) {
        wrap.innerHTML = `<div class="card"><p style="font-size:13px;color:var(--ink-soft);">مفيش أوراق متاحة لك حاليًا.</p></div>`;
        return;
      }

      wrap.innerHTML = "";
      const listContainer = viewMode === "list" ? document.createElement("div") : null;
      if (listContainer) {
        listContainer.style.cssText = "background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;";
        wrap.appendChild(listContainer);
      }

      wSnap.docs.forEach((d) => {
        const w = d.data();
        const sub = submissionByWorksheet[d.id];
        const status = sub ? sub.status : "not-started";
        const card = document.createElement("div");

        if (viewMode === "list") {
          card.className = "ws-list-row";
          card.innerHTML = `
            <span style="font-size:14px;font-weight:500;">${w.title}</span>
            <span class="status-pill status-${status}">${statusLabels[status]}</span>
          `;
          card.addEventListener("click", () => { window.location.href = `solve.html?worksheetId=${d.id}`; });
          listContainer.appendChild(card);
        } else {
          card.className = "ws-card";
          card.innerHTML = `
            <div>
              <p style="margin:0;font-weight:700;font-size:15px;">${w.title}</p>
              <p style="margin:4px 0 0;font-size:12px;color:var(--ink-soft);">${w.unit || ""} ${w.lesson ? "— " + w.lesson : ""}</p>
            </div>
            <span class="status-pill status-${status}">${statusLabels[status]}</span>
          `;
          card.addEventListener("click", () => { window.location.href = `solve.html?worksheetId=${d.id}`; });
          wrap.appendChild(card);
        }
      });
    }
  </script>
</body>
</html>
