<!-- إصدار: 2026-10-16.1 -->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة النشاط المدرسي</title>
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="mn-dialog.js?v=2026-10-06.1"></script>
<script src="users-api.js"></script>
<script src="form-header.js?v=2026-10-15.3"></script>
<script src="sem-guard.js?v=2026-10-14.5"></script>
<script src="dash-base.js?v=2026-10-15.1"></script>
<script src="activity-core.js?v=2026-10-16.1"></script>
<script>
(function(){
const { esc, arN, $, $$, CLUBS_DEFAULT, DOMAINS, GENERAL_TEMPLATE, DAYS, PLAN_ST, ST_CLS } = ACT;
const N = arN;
const S = { env:null, canEdit:false, isSA:false, tab:'summary', clubId:null, clubTab:'members', asTab:'assign',
  cfg:null, council:null, meetings:[], clubs:[], events:[], general:[], broadcast:null, assigns:[], opens:[], staff:null, roster:null };

/* ====================== التحميل ====================== */
const CONF = ()=>ACT.keyOf(S.env.sid, S.env.period);
async function load(parts){
  const e = S.env, all = !parts, has = k=>all || parts.includes(k);
  const jobs = [];
  if(has('cfg')) jobs.push(ACT.getDoc(e,'activityConfig',CONF()).then(v=>{ S.cfg=v; }));
  if(has('council')) jobs.push(ACT.getDoc(e,'activityCouncil',CONF()).then(v=>{ S.council=v; }));
  if(has('meetings')) jobs.push(ACT.list(e,'activityMeetings').then(v=>{ S.meetings=v.sort((a,b)=>(a.meetingNumber||0)-(b.meetingNumber||0)); }));
  if(has('clubs')) jobs.push(ACT.list(e,'activityClubs').then(v=>{ S.clubs=v.sort((a,b)=>(a.order||0)-(b.order||0)||(a.name||'').localeCompare(b.name||'','ar')); }));
  if(has('events')) jobs.push(ACT.list(e,'activityEvents').then(v=>{ S.events=v; }));
  if(has('general')) jobs.push(ACT.list(e,'activityGeneralEvents').then(v=>{ S.general=v; }));
  if(has('broadcast')) jobs.push(ACT.getDoc(e,'activityBroadcast',CONF()).then(v=>{ S.broadcast=v; }));
  if(has('assigns')) jobs.push(ACT.list(e,'actAssignments').then(v=>{ S.assigns=v; }));
  if(has('opens')) jobs.push(ACT.list(e,'actOpenEvents').then(v=>{ S.opens=v; }));
  await Promise.all(jobs);
}
async function ensurePeople(){
  if(!S.staff) S.staff = await ACT.loadStaff(S.env);
  if(!S.roster) S.roster = await ACT.loadRoster(S.env);
}
const clubById = id=>S.clubs.find(c=>c.id===id);
const activeClubs = ()=>S.clubs.filter(c=>c.status!=='inactive');
const E = h=>S.canEdit ? h : '';            // عناصر التحرير
const P = h=>S.isSA ? h : '';                // عناصر المدير فقط
const approvedEvents = ()=>S.events.filter(x=>x.approvalStatus==='approved' && x.status!=='cancelled');
const pendingDocs = ()=>S.events.filter(x=>x.approvalStatus==='pending' && (x.sourceType==='assignment'||x.sourceType==='open'));
const pendingAssigns = ()=>S.assigns.filter(a=>a.status==='pending');
const chip = (t,c)=>'<span class="dh-chip '+(c||'')+'">'+esc(t)+'</span>';
const fmtD = k=>k?(ACT.hijri(k)+' <span class="dh-sub">('+N(k)+')</span>'):'—';
const staffName = id=>((S.staff||[]).find(s=>s.id===id)||{}).name||'';

/* ====================== الهيكل والتبويبات ====================== */
function tabsDef(){
  const badge = S.isSA ? pendingAssigns().length : (S.canEdit ? pendingDocs().length : 0);
  return [['summary','الملخص'],['council','مجلس النشاط'],['clubs','الأندية'],['plan','الخطة العامة'],['general','المسار العام'],['assign','التكليف والتوثيق',badge],['broadcast','الإذاعة'],['reports','التقارير']];
}
function shell(){
  const t = tabsDef();
  return '<div class="ac-tabs">'+t.map(x=>'<button class="ac-tab'+(S.tab===x[0]?' on':'')+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+(x[2]?'<span class="n">'+N(x[2])+'</span>':'')+'</button>').join('')+'</div>'
    +(S.canEdit?'':'<div class="dh-card" style="background:#fff8e6;border-color:#f0d9a0">وضع الاطلاع: لديك صلاحية العرض فقط دون التعديل.</div>')
    +'<div id="acBody"></div>';
}
function paint(){
  S.env.main.innerHTML = shell();
  const body = $('#acBody');
  if(!S.cfg || !S.cfg.active){ body.innerHTML = activationView(); return; }
  const fn = { summary:vSummary, council:vCouncil, clubs:vClubs, plan:vPlan, general:vGeneral, assign:vAssign, broadcast:vBroadcast, reports:vReports }[S.tab];
  body.innerHTML = fn();
  if(S.tab==='clubs' && S.clubId) afterClubPaint();
}
async function refresh(parts){ await load(parts); paint(); }

function activationView(){
  if(!S.canEdit) return '<div class="dh-card dh-soon"><div class="ic">🎯</div><h2>لم تُفعَّل المنصة بعد</h2><p>لم يفعّل رائد النشاط منصة النشاط لهذا الفصل الدراسي بعد.</p></div>';
  return '<div class="dh-card dh-soon"><div class="ic">🎯</div><h2>تفعيل منصة النشاط المدرسي</h2><p>عند التفعيل تُنشأ الأندية الوزارية السبعة لهذا الفصل الدراسي، وبعدها يمكنك إضافة أندية جديدة أو تعديل الأندية أو حذف ما لا تحتاجه المدرسة.</p>'
    +'<button class="ac-btn" data-a="activate">تفعيل المنصة وإنشاء الأندية السبعة</button></div>';
}

/* ====================== الملخص وبطاقة الأداء ====================== */
function planStats(){
  let total=0, done=0; const per = [];
  activeClubs().forEach(c=>{ const it=(c.plan||[]).filter(x=>x.status!=='cancelled'); const d=it.filter(x=>x.status==='executed').length; total+=it.length; done+=d; per.push({club:c, total:it.length, done:d}); });
  return { total, done, per, pct: total?done/total:0 };
}
function scoreRows(){
  const ac = activeClubs(), ps = planStats(), man = (S.cfg&&S.cfg.manual)||{};
  const withPlan = ac.filter(c=>(c.plan||[]).filter(x=>x.status!=='cancelled').length>0);
  const complete = p=>{ const it=(p||[]).filter(x=>x.status!=='cancelled'); if(!it.length) return false; return it.filter(x=>x.title&&x.expectedDate&&x.responsible).length/it.length>=0.75; };
  const execd = p=>{ const it=(p||[]).filter(x=>x.status!=='cancelled'); if(!it.length) return false; return it.filter(x=>x.status==='executed').length/it.length>0.75; };
  const clubRatios = withPlan.map(c=>{ const it=c.plan.filter(x=>x.status!=='cancelled'); return it.filter(x=>x.status==='executed').length/it.length; });
  const avg = clubRatios.length ? clubRatios.reduce((a,b)=>a+b,0)/clubRatios.length : 0;
  const gen = S.general.filter(g=>g.status!=='cancelled'), genDone = gen.filter(g=>g.status==='executed');
  const unplanned = approvedEvents().filter(x=>!x.planItemId && x.track!=='general' && (x.sourceType==='club'||x.sourceType==='open')).length;
  const nat = S.general.find(g=>g.templateId==='national_day');
  const R = (n,name,max,got,auto)=>({ n,name,max,got:Math.round(Math.min(max,got)*10)/10,auto });
  return [
    R(1,'إعداد الخطة العامة',10, S.cfg&&S.cfg.planStatus==='approved'?10:0,true),
    R(2,'تشكيل مجلس النشاط',10, S.council?10:0,true),
    R(3,'تشكيل الأندية',70, Math.min(1,ac.length/7)*70,true),
    R(4,'إعداد خطط الأندية',70, ac.length? withPlan.length/ac.length*70:0,true),
    R(5,'تهيئة البيئة المدرسية',10, man.env?10:0,false),
    R(6,'تهيئة مقرات الأندية',10, man.venues?10:0,false),
    R(7,'تنفيذ الخطة العامة',70, ps.pct*70,true),
    R(8,'تنفيذ خطة كل نادٍ',70, avg*70,true),
    R(9,'تقويم بناء الخطط',70, withPlan.length? withPlan.filter(c=>complete(c.plan)).length/withPlan.length*70:0,true),
    R(10,'تقويم تنفيذ الخطط',70, withPlan.length? withPlan.filter(c=>execd(c.plan)).length/withPlan.length*70:0,true),
    R(11,'المبادرات المتميزة',40, unplanned/4*40,true),
    R(12,'الدراسات الإجرائية',20, (Number(man.studies)||0)*10,false),
    R(13,'البرامج الختامية',10, man.closing?10:0,false),
    R(14,'الأسابيع والأيام الخدمية',10, gen.length? genDone.length/gen.length*10:0,true),
    R(15,'الاحتفال باليوم الوطني',10, nat&&nat.status==='executed'?10:0,true)
  ];
}
function vSummary(){
  const ac = activeClubs(), ps = planStats();
  const students = ac.reduce((n,c)=>n+(c.members||[]).length,0);
  const evs = approvedEvents().length;
  // ملخص الأنشطة الموثّقة: باسم النشاط وعدد المعلمين
  const grp = {};
  S.events.filter(x=>(x.sourceType==='assignment'||x.sourceType==='open') && x.approvalStatus!=='returned').forEach(x=>{
    const k = (x.title||'').trim(); (grp[k]=grp[k]||new Set()).add(x.documentedBy);
  });
  const docs = Object.keys(grp).map(k=>[k,grp[k].size]).sort((a,b)=>b[1]-a[1]);
  const todayK = ACT.today(), in14 = ACT.addDays(todayK,14);
  const alerts = [];
  ac.filter(c=>!(c.plan||[]).length).forEach(c=>alerts.push('⚠ '+c.name+' بدون خطة فصلية'));
  ac.forEach(c=>(c.plan||[]).filter(x=>x.status==='planned' && x.expectedDate && x.expectedDate<=in14).forEach(x=>alerts.push((x.expectedDate<todayK?'⏰ متأخرة: ':'📅 قادمة: ')+x.title+' — '+c.name+' ('+ACT.hijri(x.expectedDate)+')')));
  if(S.isSA && pendingAssigns().length) alerts.push('📝 '+N(pendingAssigns().length)+' تكليف بانتظار اعتمادك');
  if(S.canEdit && pendingDocs().length) alerts.push('🗂 '+N(pendingDocs().length)+' توثيق بانتظار اعتماد رائد النشاط');
  if(!S.council) alerts.push('⚠ لم يُشكَّل مجلس النشاط بعد');
  const rows = scoreRows(), tot = rows.reduce((n,r)=>n+r.got,0), man=(S.cfg&&S.cfg.manual)||{};
  return '<div class="dh-stats">'
    +'<div class="dh-stat"><b>'+N(ac.length)+'</b><span>نادٍ مفعّل</span></div>'
    +'<div class="dh-stat"><b>'+N(students)+'</b><span>طالب مسجّل بالأندية</span></div>'
    +'<div class="dh-stat"><b>'+N(evs)+'</b><span>فعالية معتمدة</span></div></div>'
    +'<div class="dh-card"><h3>نسبة تنفيذ الخطة: '+N(Math.round(ps.pct*100))+'٪</h3><div class="ac-bar"><i style="width:'+Math.round(ps.pct*100)+'%"></i></div><div class="dh-sub" style="margin-top:4px">'+N(ps.done)+' من '+N(ps.total)+' بنود منفَّذة</div></div>'
    +'<div class="dh-grid"><div class="dh-card"><h3>التنبيهات</h3><div class="dh-list">'+(alerts.length?alerts.map(a=>'<div class="dh-item">'+esc(a)+'</div>').join(''):'<div class="dh-empty">لا توجد تنبيهات.</div>')+'</div></div>'
    +'<div class="dh-card"><h3>الأنشطة الموثّقة</h3><div class="dh-list">'+(docs.length?docs.map(d=>'<div class="dh-item"><span>'+esc(d[0])+'</span>'+chip('وثّقه '+N(d[1])+' معلم')+'</div>').join(''):'<div class="dh-empty">لا توجد توثيقات بعد.</div>')+'</div><div class="dh-sub" style="margin-top:6px">تفاصيل المعلمين في تبويب التقارير.</div></div></div>'
    +'<div class="dh-card"><div class="ac-row sb"><h3 style="margin:0">بطاقة أداء النشاط</h3>'+chip(N(Math.round(tot))+' من ٥٥٠','')+'</div>'
    +'<div class="ac-wrap"><table class="ac-tbl" style="margin-top:8px"><tr><th>#</th><th>المؤشر</th><th>الحد الأعلى</th><th>المحتسب</th><th>طريقة الحساب</th></tr>'
    +rows.map(r=>'<tr><td>'+N(r.n)+'</td><td>'+esc(r.name)+'</td><td>'+N(r.max)+'</td><td><b>'+N(r.got)+'</b></td><td class="dh-sub">'+(r.auto?'تلقائي':'إدخال يدوي')+'</td></tr>').join('')
    +'</table></div>'
    +E('<div class="ac-row" style="margin-top:10px"><label><input type="checkbox" data-man="env"'+(man.env?' checked':'')+'> تمت تهيئة البيئة المدرسية</label><label><input type="checkbox" data-man="venues"'+(man.venues?' checked':'')+'> تمت تهيئة مقرات الأندية</label><label><input type="checkbox" data-man="closing"'+(man.closing?' checked':'')+'> نُفِّذت البرامج الختامية</label><label>عدد الدراسات الإجرائية: <input type="number" min="0" max="2" data-man="studies" class="ac-in" style="width:70px;display:inline-block" value="'+esc(man.studies||0)+'"></label></div>')
    +'</div>';
}

/* ====================== مجلس النشاط ====================== */
function vCouncil(){
  const c = S.council;
  if(!c) return '<div class="dh-card dh-soon"><div class="ic">🏛️</div><h2>مجلس النشاط</h2><p>لم يُشكَّل المجلس بعد.</p>'+P('<button class="ac-btn" data-a="council-form">تشكيل مجلس النشاط</button>')+(S.isSA?'':'<p class="dh-sub">تشكيل المجلس من صلاحية قائد المدرسة.</p>')+'</div>';
  return '<div class="dh-card"><div class="ac-row sb"><h3 style="margin:0">مجلس النشاط</h3><div class="ac-row"><button class="ac-btn sec sm" data-a="print-council">🖨 طباعة القرار</button>'+P('<button class="ac-btn sm" data-a="council-form">✏ تعديل التشكيل</button>')+'</div></div>'
    +'<div class="dh-list" style="margin-top:8px"><div class="dh-item"><span>الرئيس</span><b>'+esc(c.chairName)+'</b>'+chip('قائد المدرسة')+'</div>'
    +'<div class="dh-item"><span>المقرر</span><b>'+esc(c.secretaryName||'—')+'</b>'+chip('رائد النشاط')+'</div>'
    +(c.members||[]).map(m=>'<div class="dh-item"><span>عضو</span><b>'+esc(m.name)+'</b>'+chip(m.role||'عضو')+'</div>').join('')+'</div></div>'
    +'<div class="dh-card"><div class="ac-row sb"><h3 style="margin:0">محاضر الاجتماعات</h3>'+E('<button class="ac-btn sm" data-a="meeting-add">+ إضافة اجتماع</button>')+'</div>'
    +(S.meetings.length?S.meetings.map(m=>'<div class="dh-card" style="margin:8px 0 0"><div class="ac-row sb"><b>الاجتماع '+N(m.meetingNumber)+' — '+fmtD(m.date)+'</b>'+E('<button class="ac-btn sec sm" data-a="meeting-edit" data-id="'+m.id+'">تعديل</button>')+'</div>'
      +'<p style="margin:6px 0">'+esc(m.summary)+'</p>'
      +((m.decisions||[]).length?'<ol style="margin:0 18px">'+(m.decisions||[]).map(d=>'<li>'+esc(d)+'</li>').join('')+'</ol>':'')
      +'<div class="dh-sub">الحضور: '+N((m.attendees||[]).length)+' من '+N((m.attendees||[]).length+(m.absentees||[]).length)+'</div></div>').join(''):'<div class="dh-empty">لا توجد محاضر بعد.</div>')+'</div>';
}
async function councilForm(){
  await ensurePeople();
  const ex = S.council, staff = S.staff;
  let mem = (ex&&ex.members||[]).map(m=>Object.assign({},m));
  const hasEdit = s=>!!(s.perms&&s.perms['tools.activity']&&s.perms['tools.activity'].edit===true);
  const opt = (sel)=>'<option value="">— اختر —</option>'+staff.map(s=>'<option value="'+esc(s.id)+'"'+(sel===s.id?' selected':'')+'>'+esc(s.name)+(hasEdit(s)?' ✓ (بصلاحية النشاط)':'')+'</option>').join('');
  const rowsHtml = ()=>mem.map((m,i)=>'<div class="ac-row" style="margin-bottom:6px"><select class="ac-sel" style="flex:2" data-mi="'+i+'" data-f="id">'+opt(m.id)+'</select><input class="ac-in" style="flex:2" data-mi="'+i+'" data-f="role" placeholder="الصفة (مثال: رئيس النادي الرياضي)" value="'+esc(m.role||'')+'"><button type="button" class="ac-btn bad sm" data-mdel="'+i+'">×</button></div>').join('');
  const body = '<div class="ac-f"><label>الرئيس</label><div class="ac-in" style="background:#f4f7f6">'+esc(S.env.me.name)+' (قائد المدرسة)</div></div>'
    +'<div class="ac-f"><label>المقرر (رائد النشاط) *</label><select class="ac-sel" id="cn_sec">'+opt(ex&&ex.secretaryId)+'</select><div class="dh-sub">رائد النشاط يحتاج صلاحية «منصة النشاط المدرسي» بمستوى «تعديل» تمنحها له من الصلاحيات الخاصة.</div></div>'
    +'<div class="ac-f"><label>الأعضاء (رؤساء الأندية وغيرهم)</label><div id="cn_rows"></div><button type="button" class="ac-btn sec sm" id="cn_add">+ إضافة عضو</button></div>';
  ACT.modal({ title: ex?'تعديل تشكيل مجلس النشاط':'تشكيل مجلس النشاط', body, wide:true, noDismiss:true,
    onOpen: api=>{
      const draw = ()=>{ api.q('#cn_rows').innerHTML = rowsHtml(); };
      draw();
      api.q('#cn_add').onclick = ()=>{ mem.push({id:'',role:''}); draw(); };
      api.el.addEventListener('input', e=>{ const i=e.target.dataset.mi; if(i!=null) mem[i][e.target.dataset.f] = e.target.value; });
      api.el.addEventListener('click', e=>{ const d=e.target.dataset.mdel; if(d!=null){ mem.splice(Number(d),1); draw(); } });
    },
    buttons:[{ label:'حفظ التشكيل', onClick: async api=>{
      const secId = api.q('#cn_sec').value; if(!secId){ ACT.toast('اختر مقرر المجلس (رائد النشاط)'); return false; }
      const secU = staff.find(x=>x.id===secId);
      if(secU && !hasEdit(secU) && secU.role!=='schoolAdmin' && !await ACT.confirmBox('المقرر المختار لا يملك حاليًا صلاحية «منصة النشاط المدرسي» (تعديل)، فلن يتمكن من إدارة المنصة حتى تمنحه إياها من الصلاحيات الخاصة. هل تريد المتابعة؟')) return false;
      const members = mem.filter(m=>m.id).map(m=>({ id:m.id, uid:m.id, name:staffName(m.id), role:(m.role||'').trim()||'عضو' }));
      const data = { chairId:S.env.me.id, chairName:S.env.me.name, secretaryId:secId, secretaryName:staffName(secId), members, formedBy:S.env.me.id };
      if(ex) await ACT.patch(S.env,'activityCouncil',CONF(),data); else await ACT.create(S.env,'activityCouncil',Object.assign(data,{formedAt:Date.now()}),CONF());
      await ACT.patch(S.env,'activityConfig',CONF(),{ councilFormed:true, councilFormedAt:Date.now(), coordinatorId:secId, coordinatorName:staffName(secId) });
      await refresh(['council','cfg']); return true; } },{ label:'إلغاء', cls:'sec' }] });
}
async function meetingForm(id){
  await ensurePeople();
  const ex = id ? S.meetings.find(x=>x.id===id) : null;
  const mem = S.council ? [{id:S.council.chairId,name:S.council.chairName},{id:S.council.secretaryId,name:S.council.secretaryName}].concat(S.council.members||[]) : [];
  const seen = new Set(); const people = mem.filter(m=>m.id && !seen.has(m.id) && seen.add(m.id));
  const att = new Set(ex?ex.attendees:people.map(p=>p.id));
  const body = '<div class="ac-2c"><div class="ac-f"><label>رقم الاجتماع</label><input type="number" class="ac-in" id="mt_no" value="'+(ex?ex.meetingNumber:(S.meetings.length+1))+'"></div><div class="ac-f"><label>التاريخ *</label><input type="date" class="ac-in" id="mt_date" value="'+esc(ex?ex.date:ACT.today())+'"></div></div>'
    +'<div class="ac-f"><label>الملخص *</label><textarea class="ac-ta" id="mt_sum">'+esc(ex?ex.summary:'')+'</textarea></div>'
    +'<div class="ac-f"><label>القرارات (قرار في كل سطر)</label><textarea class="ac-ta" id="mt_dec">'+esc(ex?(ex.decisions||[]).join('\n'):'')+'</textarea></div>'

      const done = t.asg.filter(x=>x.ev).length + t.open.length, miss = t.asg.filter(x=>!x.ev).length;
      return '<details class="ac-acc"><summary><span>'+esc(t.name)+'</span><span>'+chip('موثّق: '+N(done),'ok')+' '+chip('غير منفّذ: '+N(miss), miss?'bad':'')+'</span></summary><div class="in">'
        +'<b>أنشطة مكلّف بها</b>'+(t.asg.length?t.asg.map(x=>'<div class="dh-item" style="margin-top:4px"><span>'+(x.ev?'✅':'❌')+' '+esc(x.p.name)+'</span>'+(x.ev?'<button class="ac-btn sec sm" data-a="ev-print" data-id="'+x.ev.id+'">👁 معاينة</button>':'<span class="dh-sub">غير موثّق</span>')+'</div>').join(''):'<div class="dh-empty">لا توجد تكليفات معتمدة.</div>')
        +'<div style="margin-top:8px"><b>أنشطة متاحة وثّقها</b></div>'+(t.open.length?t.open.map(x=>'<div class="dh-item" style="margin-top:4px"><span>✅ '+esc(x.title)+'</span><button class="ac-btn sec sm" data-a="ev-print" data-id="'+x.id+'">👁 معاينة</button></div>').join(''):'<div class="dh-empty">لم يوثّق أنشطة متاحة.</div>')+'</div></details>';
    }).join(''):'<div class="dh-empty">لا توجد تكليفات أو توثيقات بعد.</div>')+'</div>';
}

/* ====================== الطباعة ====================== */
const tbl = (heads, rows)=>'<table class="pt"><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';
const termLine = ()=>'للعام الدراسي '+esc(FormHdr.yearTxt(S._ctx&&S._ctx.year)||'')+' — '+esc(FormHdr.termName(S.env.period));
const sigBlock = (a,b)=>'<div class="fh-sig" style="margin-top:34px"><span>'+a+'<br><br>التوقيع: ____________</span><span>'+b+'<br><br>التوقيع: ____________</span></div>';
async function printKind(kind, id, evId){
  const e = S.env, hij = ACT.hijri(ACT.today());
  const pr = (title, body, opts)=>ACT.printPage(e, title, body, opts);
  if(kind==='council'){
    if(!S.council){ ACT.toast('شكّل المجلس أولًا'); return; }
    const c = S.council, rows = [[c.chairName,'رئيس المجلس (قائد المدرسة)'],[c.secretaryName,'المقرر (رائد النشاط)']].concat((c.members||[]).map(m=>[m.name,'عضو ('+m.role+')']));
    await pr('قرار تشكيل مجلس النشاط الطلابي','<p class="pp">بناءً على التعليمات الواردة من وزارة التعليم بشأن تفعيل برنامج النشاط الطلابي، تقرر تشكيل مجلس النشاط على النحو التالي:</p>'+tbl(['م','الاسم','الصفة في المجلس'],rows.map((r,i)=>[N(i+1)].concat(r)))+sigBlock('قائد المدرسة: '+esc(c.chairName),'التاريخ: '+hij));
  } else if(kind==='clubsdec'){
    await pr('قرار تشكيل الأندية المدرسية للنشاط الطلابي','<p class="pp">تقرر تشكيل الأندية المدرسية للنشاط الطلابي وتعيين مشرفيها على النحو التالي:</p>'+tbl(['م','النادي','المشرف','المشرفون المناوبون'],activeClubs().map((c,i)=>[N(i+1),c.name,c.headName||'—',(c.supervisors||[]).map(s=>s.name).join('، ')||'—']))+sigBlock('رائد النشاط: '+esc((S.council&&S.council.secretaryName)||''),'قائد المدرسة'));
  } else if(kind==='clubplan'){
    const c = clubById(id); const pl = c.plan||[];
    await pr('خطة '+c.name,'<p class="pp">المشرف: <b>'+esc(c.headName||'—')+'</b> — عدد الأعضاء: <b>'+N((c.members||[]).length)+'</b></p>'+tbl(['م','الفعالية','التاريخ المتوقع','المسؤول','الحالة'],pl.map((x,i)=>[N(i+1),x.title,ACT.hijri(x.expectedDate),x.responsible||'',PLAN_ST[x.status]||'']))+sigBlock('رائد النشاط: '+esc((S.council&&S.council.secretaryName)||''),'قائد المدرسة'));
  } else if(kind==='genplan'){
    const body = activeClubs().map(c=>'<h3 style="margin:14px 0 4px">'+esc(c.name)+' — المشرف: '+esc(c.headName||'—')+'</h3>'+((c.plan||[]).length?tbl(['م','الفعالية','التاريخ المتوقع','المسؤول'],(c.plan||[]).filter(x=>x.status!=='cancelled').map((x,i)=>[N(i+1),x.title,ACT.hijri(x.expectedDate),x.responsible||''])):'<p class="pp">لا توجد خطة.</p>')).join('')
      +'<h3 style="margin:14px 0 4px">فعاليات المسار العام</h3>'+tbl(['م','الفعالية','النادي المسؤول','التاريخ'],S.general.filter(g=>g.status!=='cancelled').map((g,i)=>[N(i+1),g.title,g.responsibleClubName||'',g.expectedDate?ACT.hijri(g.expectedDate):'']));
    await pr('الخطة العامة للنشاط الطلابي', body+sigBlock('رائد النشاط: '+esc((S.council&&S.council.secretaryName)||''),'قائد المدرسة'));
  } else if(kind==='clubreport'){
    const c = clubById(id), ev = S.events.filter(x=>x.clubId===c.id && x.approvalStatus==='approved'), ps = (c.plan||[]).filter(x=>x.status!=='cancelled');
    await pr('تقرير '+c.name,'<p class="pp">المشرف: <b>'+esc(c.headName||'—')+'</b> — الأعضاء: <b>'+N((c.members||[]).length)+'</b> — بنود الخطة: <b>'+N(ps.length)+'</b> — المنفَّذ: <b>'+N(ps.filter(x=>x.status==='executed').length)+'</b></p>'
      +'<h3>الفعاليات المنفَّذة</h3>'+tbl(['م','الفعالية','التاريخ','المشاركون','الصور'],ev.map((x,i)=>[N(i+1),x.title,ACT.hijri(x.date),N(x.participantCount||0),N((x.photos||[]).length)]))+sigBlock('رائد النشاط','قائد المدرسة'));
  } else if(kind==='genreport'){
    const rows = scoreRows(), tot = rows.reduce((n,r)=>n+r.got,0);
    await pr('التقرير العام للنشاط الطلابي','<p class="pp">عدد الأندية: <b>'+N(activeClubs().length)+'</b> — الطلاب المسجَّلون: <b>'+N(activeClubs().reduce((n,c)=>n+(c.members||[]).length,0))+'</b> — الفعاليات المعتمدة: <b>'+N(approvedEvents().length)+'</b></p>'
      +'<h3>الأندية</h3>'+tbl(['النادي','المشرف','الأعضاء','بنود الخطة','المنفَّذ','الفعاليات'],activeClubs().map(c=>{ const ps=(c.plan||[]).filter(x=>x.status!=='cancelled'); return [c.name,c.headName||'—',N((c.members||[]).length),N(ps.length),N(ps.filter(x=>x.status==='executed').length),N(approvedEvents().filter(x=>x.clubId===c.id).length)]; }))
      +'<h3>بطاقة أداء النشاط ('+N(Math.round(tot))+' من ٥٥٠)</h3>'+tbl(['#','المؤشر','الحد الأعلى','المحتسب'],rows.map(r=>[N(r.n),r.name,N(r.max),N(r.got)]))+sigBlock('رائد النشاط','قائد المدرسة'),{ landscape:false });
  } else if(kind==='att'){
    const c = clubById(id), ev = S.events.find(x=>x.id===evId), att = ev.attendance||{};
    await pr('سجل حضور فعالية','<p class="pp">النادي: <b>'+esc(c.name)+'</b> — الفعالية: <b>'+esc(ev.title)+'</b> — التاريخ: <b>'+ACT.hijri(ev.date)+'</b></p>'+tbl(['م','اسم الطالب','الفصل','الحضور'],(c.members||[]).map((m,i)=>[N(i+1),m.name,m.className||m.classCode||'',att[m.seat]?(att[m.seat].status==='present'?'حاضر':'غائب'):'—']))+sigBlock('المشرف','رائد النشاط'));
  }
}
async function evPrint(id){
  const ev = S.events.find(x=>x.id===id); if(!ev) return;
  await ACT.printDoc(S.env, ev, { coordinator:(S.council&&S.council.secretaryName)||S.cfg.coordinatorName||'' });
}

/* ====================== الإجراءات ====================== */
async function activate(){
  if(!await ACT.confirmBox('ستُنشأ الأندية الوزارية السبعة لهذا الفصل الدراسي. متابعة؟')) return;
  const e = S.env, b = e.db.batch(), now = Date.now();
  b.set(e.db.collection('activityConfig').doc(CONF()), { schoolId:e.sid, period:e.period, active:true, planStatus:'draft', manual:{env:false,venues:false,studies:0,closing:false}, councilFormed:false, createdBy:e.me.id, createdAt:now, updatedAt:now });
  CLUBS_DEFAULT.forEach((c,i)=>b.set(e.db.collection('activityClubs').doc(), { schoolId:e.sid, period:e.period, key:c.key, name:c.name, domain:c.domain, icon:c.icon, dom:c.dom, isDefault:true, headId:null, headName:'', supervisors:[], members:[], plan:[], status:'active', locked:false, order:i, createdBy:e.me.id, createdAt:now, updatedAt:now }));
  await b.commit(); ACT.toast('تم تفعيل المنصة'); await refresh();
}
const H = {
  'tab': el=>{ S.tab=el.dataset.v; S.clubId = S.tab==='clubs'?S.clubId:null; paint(); },
  'activate': activate,
  'council-form': councilForm,
  'meeting-add': ()=>meetingForm(null), 'meeting-edit': el=>meetingForm(el.dataset.id),
  'print-council': ()=>printKind('council'), 'print-clubsdec': ()=>printKind('clubsdec'), 'print-genplan': ()=>printKind('genplan'), 'print-genreport': ()=>printKind('genreport'),
  'club-add': ()=>clubForm(null), 'club-edit': el=>clubForm(el.dataset.id), 'club-del': el=>clubDelete(el.dataset.id),
  'club-react': async el=>{ await ACT.patch(S.env,'activityClubs',el.dataset.id,{status:'active'}); await refresh(['clubs']); },
  'club-open': el=>{ S.clubId=el.dataset.id; S.clubTab='members'; paint(); },
  'club-open-plan': el=>{ S.tab='clubs'; S.clubId=el.dataset.id; S.clubTab='plan'; paint(); },
  'club-back': ()=>{ S.clubId=null; paint(); },
  'club-tab': el=>{ S.clubTab=el.dataset.v; paint(); },
  'mem-add': el=>memAdd(el.dataset.id),
  'mem-del': async el=>{ const c=clubById(el.dataset.id); if(!await ACT.confirmBox('حذف الطالب من النادي؟')) return; await ACT.patch(S.env,'activityClubs',c.id,{ members:(c.members||[]).filter(m=>m.seat!==el.dataset.seat) }); await refresh(['clubs']); },
  'plan-add': el=>planForm(el.dataset.id,null), 'plan-edit': el=>planForm(el.dataset.id,el.dataset.pid),
  'plan-del': async el=>{ const c=clubById(el.dataset.id); if(!await ACT.confirmBox('حذف هذا البند من الخطة؟')) return; await ACT.patch(S.env,'activityClubs',c.id,{ plan:(c.plan||[]).filter(x=>x.id!==el.dataset.pid) }); await refresh(['clubs']); },
  'print-clubplan': el=>printKind('clubplan',el.dataset.id),
  'rp-clubplan': ()=>printKind('clubplan',$('#rp_club').value), 'rp-clubreport': ()=>printKind('clubreport',$('#rp_club').value),
  'exec-add': el=>execForm(el.dataset.id),
  'ev-print': el=>evPrint(el.dataset.id),
  'att-save': async el=>{
    const c = clubById(el.dataset.id), att = {};
    $$('#clubBody input[data-seat]').forEach(i=>{ const m=(c.members||[]).find(x=>x.seat===i.dataset.seat); att[i.dataset.seat]={ name:m.name, class:m.classCode, status:i.checked?'present':'absent' }; });
    await ACT.patch(S.env,'activityEvents',el.dataset.ev,{ attendance:att, attendanceBy:S.env.me.id }); ACT.toast('تم حفظ الحضور'); await refresh(['events']);
  },
  'print-att': el=>printKind('att',el.dataset.id,el.dataset.ev),
  'plan-submit': async ()=>{ if(!await ACT.confirmBox('تقديم الخطة العامة لقائد المدرسة للاعتماد؟')) return; await ACT.patch(S.env,'activityConfig',CONF(),{planStatus:'submitted',planSubmittedAt:Date.now()}); await refresh(['cfg']); },
  'plan-approve': async ()=>{ if(!await ACT.confirmBox('اعتماد الخطة العامة؟')) return; await ACT.patch(S.env,'activityConfig',CONF(),{planStatus:'approved',planApprovedAt:Date.now(),planApprovedBy:S.env.me.id,planApprovedByName:S.env.me.name}); await refresh(['cfg']); },
  'plan-reopen': async ()=>{ await ACT.patch(S.env,'activityConfig',CONF(),{planStatus:'draft',planApprovedAt:null}); await refresh(['cfg']); },
  'gen-add': ()=>genForm(null), 'gen-edit': el=>genForm(el.dataset.id), 'gen-tpl': genTemplate, 'gen-exec': el=>genExec(el.dataset.id),
  'as-tab': el=>{ S.asTab=el.dataset.v; paint(); },
  'asg-add': ()=>asgForm(null), 'asg-edit': el=>asgForm(el.dataset.id),
  'asg-approve': async el=>{ await ACT.patch(S.env,'actAssignments',el.dataset.id,{ status:'approved', approvedBy:S.env.me.id, approvedByName:S.env.me.name, approvedAt:Date.now() }); await refresh(['assigns']); },
  'asg-cancel': async el=>{ if(!await ACT.confirmBox('إلغاء هذا التكليف؟')) return; await ACT.patch(S.env,'actAssignments',el.dataset.id,{status:'cancelled'}); await refresh(['assigns']); },
  'open-add': ()=>openForm(null), 'open-edit': el=>openForm(el.dataset.id),
  'open-toggle': async el=>{ const o=S.opens.find(x=>x.id===el.dataset.id); await ACT.patch(S.env,'actOpenEvents',o.id,{status:o.status==='open'?'closed':'open'}); await refresh(['opens']); },
  'ev-approve': async el=>{ await ACT.patch(S.env,'activityEvents',el.dataset.id,{ approvalStatus:'approved', approvedBy:S.env.me.id, approvedByName:S.env.me.name, approvedAt:Date.now(), returnNote:'' }); await refresh(['events']); },
  'ev-return': async el=>{ const n = await (window.mnPrompt?window.mnPrompt('سبب الإعادة للمعلم (يظهر له):',''):Promise.resolve('')); if(n===null) return; await ACT.patch(S.env,'activityEvents',el.dataset.id,{ approvalStatus:'returned', returnNote:n||'' }); await refresh(['events']); },
  'bc-add': bcAdd, 'bc-edit': el=>bcEdit(Number(el.dataset.w),Number(el.dataset.d)),
  'bc-delweek': async el=>{ if(!await ACT.confirmBox('حذف هذا الأسبوع من جدول الإذاعة؟')) return; const w=S.broadcast.weeks.slice(); w.splice(Number(el.dataset.w),1); w.forEach((x,i)=>x.weekNumber=i+1); await saveBroadcast(w); }
};
function bind(){
  S.env.main.addEventListener('click', async e=>{
    const el = e.target.closest('[data-a]'); if(!el || !S.env.main.contains(el)) return;
    const f = H[el.dataset.a]; if(!f) return;
    el.disabled = true;
    try{ await f(el); }catch(err){ console.error(err); ACT.toast(err&&err.message?err.message:'تعذّر تنفيذ العملية'); }
    el.disabled = false;
  });
  S.env.main.addEventListener('change', async e=>{
    const man = e.target.dataset.man;
    if(man){
      const m = Object.assign({env:false,venues:false,studies:0,closing:false}, (S.cfg&&S.cfg.manual)||{});
      m[man] = man==='studies' ? Math.max(0,Math.min(2,Number(e.target.value)||0)) : e.target.checked;
      try{ await ACT.patch(S.env,'activityConfig',CONF(),{manual:m}); await refresh(['cfg']); }catch(err){ ACT.toast('تعذّر الحفظ'); }
      return;
    }
    if(e.target.id==='attSel'){ S.attEv = e.target.value; paint(); }
  });
}

Dash.boot({
  title:'منصة النشاط المدرسي',
  allow:(u,ctx,sid,isSA)=> (isSA || (((ctx&&ctx.permissions)||{})['tools.activity']||{}).access===true || (((ctx&&ctx.permissions)||{})['tools.activity']||{}).edit===true) ? true : 'ليست لديك صلاحية «منصة النشاط المدرسي».',
  render: async env=>{
    ACT.injectCss();
    S.env = env; S.isSA = !!env.isSA;
    const p = ((env.ctx&&env.ctx.permissions)||{})['tools.activity']||{};
    S.canEdit = S.isSA || p.edit===true;
    if(!S.canEdit) env.main.classList.add('ac-ro');
    env.main.innerHTML = '<div class="dh-empty">جارٍ التحميل...</div>';
    await load();
    await ensurePeople().catch(()=>{});
    bind(); paint();
    window.__ACT = S;
  }
});
})();
