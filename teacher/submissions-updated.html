<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة التسليمات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  .ws-row, .student-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .ws-row:last-child, .student-row:last-child { border-bottom:none; }
  .answer-block { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .grade-btn { border:1.5px solid var(--line); border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; background:#fff; margin-left:6px; }
  .grade-btn.chosen-true { background:var(--bg-success,#EAF6F1); border-color:var(--ok); color:var(--ok); font-weight:700; }
  .grade-btn.chosen-false { background:var(--coral-light); border-color:var(--bad); color:var(--bad); font-weight:700; }
</style>
</head>
<body>
  <header class="app-header">
    <h1>متابعة التسليمات</h1>
    <span style="font-size:12px;">
      <span id="teacherLabel"></span>
      <a href="#" id="logoutLink" style="color:#fff;text-decoration:underline;margin-right:10px;">خروج</a>
    </span>
  </header>

  <main class="container">

    <!-- 1) اختيار الورقة -->
    <div class="card">
      <h3 style="margin-top:0">١) اختر ورقة منشورة</h3>
      <button class="btn btn-secondary" id="refreshWsBtn">تحديث القائمة</button>
      <div id="worksheetsList" style="margin-top:14px;"></div>
    </div>

    <!-- 2) قائمة الطلاب وحالتهم -->
    <div class="card" id="studentsCard" style="display:none;">
      <h3 style="margin-top:0">٢) الطلاب — <span id="selectedWsTitle"></span></h3>
      <div id="studentsList"></div>
    </div>

    <!-- 3) تفاصيل تسليم طالب -->
    <div class="card" id="detailCard" style="display:none;">
      <h3 style="margin-top:0">تسليم: <span id="detailStudentName"></span></h3>
      <div id="answersWrap"></div>
      <button class="btn btn-primary" id="saveGradingBtn" style="width:100%;margin-top:10px;">حفظ التصحيح</button>
      <p id="gradingStatus" style="font-size:13px;color:var(--ink-soft);margin-top:10px;"></p>
    </div>

  </main>

  <script type="module">
    import { db } from "../shared/firebase-config.js";
    import {
      collection, query, where, getDocs, doc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { requireTeacherAuth, signOutTeacher } from "../shared/auth.js";

    const statusLabels = {
      "not-started": "لم يبدأ",
      "in-progress": "جاري",
      "submitted": "مُسلّم",
      "corrected": "مُصحح"
    };

    const typeLabels = {
      "fill-blank": "أكمل الفراغات",
      "fill-table": "أكمل الجدول",
      "mcq": "اختيار من متعدد",
      "true-false": "صح / خطأ",
      "matching": "مزاوجة",
      "ordering": "ترتيب",
      "open-text": "سؤال مفتوح"
    };

    let currentTeacher = null;
    let currentWorksheet = null;
    let currentWorksheetId = null;
    let currentSubmission = null;
    let manualGrades = {}; // exerciseId -> true/false

    requireTeacherAuth().then((teacher) => {
      currentTeacher = teacher;
      document.getElementById("teacherLabel").textContent = `${teacher.name} (${teacher.code})`;
      loadWorksheets();
    });
    document.getElementById("logoutLink").addEventListener("click", (e) => {
      e.preventDefault();
      signOutTeacher();
    });

    // ---------- 1) قائمة الأوراق المنشورة ----------
    async function loadWorksheets() {
      const listEl = document.getElementById("worksheetsList");
      listEl.innerHTML = "جاري التحميل...";
      const q = query(collection(db, "worksheets"),
        where("teacherCode", "==", currentTeacher.code), where("status", "==", "published"));
      const snap = await getDocs(q);

      if (snap.empty) {
        listEl.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);">مفيش أوراق منشورة حاليًا.</p>`;
        return;
      }

      listEl.innerHTML = "";
      snap.docs.forEach((d) => {
        const w = d.data();
        const row = document.createElement("div");
        row.className = "ws-row";
        row.innerHTML = `
          <div>
            <p style="margin:0;font-weight:700;font-size:14px;">${w.title}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--ink-soft);">${w.unit || ""} ${w.lesson ? "— " + w.lesson : ""}</p>
          </div>
          <span style="font-size:12px;color:var(--teal);">عرض ←</span>
        `;
        row.addEventListener("click", () => selectWorksheet(d.id, w));
        listEl.appendChild(row);
      });
    }

    // ---------- 2) عرض طلاب الفصول المعيّنة للورقة وحالتهم ----------
    async function selectWorksheet(worksheetId, w) {
      currentWorksheet = w;
      currentWorksheetId = worksheetId;
      document.getElementById("selectedWsTitle").textContent = w.title;
      document.getElementById("studentsCard").style.display = "block";
      document.getElementById("detailCard").style.display = "none";
      document.getElementById("studentsCard").scrollIntoView({ behavior: "smooth" });

      const listEl = document.getElementById("studentsList");
      listEl.innerHTML = "جاري التحميل...";

      const classIds = w.assignedClassIds || [];
      if (classIds.length === 0) {
        listEl.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);">الورقة دي مش معيّنة لأي فصل.</p>`;
        return;
      }

      const studentsQ = query(collection(db, "students"), where("currentClassId", "in", classIds.slice(0, 10)));
      const studentsSnap = await getDocs(studentsQ);

      const subsQ = query(collection(db, "submissions"), where("worksheetId", "==", worksheetId));
      const subsSnap = await getDocs(subsQ);
      const subByStudent = {};
      subsSnap.docs.forEach((d) => { subByStudent[d.data().studentId] = { id: d.id, ...d.data() }; });

      if (studentsSnap.empty) {
        listEl.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);">مفيش طلاب في الفصول المعيّنة.</p>`;
        return;
      }

      listEl.innerHTML = "";
      studentsSnap.docs.forEach((sd) => {
        const s = sd.data();
        const sub = subByStudent[sd.id];
        const status = sub ? sub.status : "not-started";
        const row = document.createElement("div");
        row.className = "student-row";
        row.innerHTML = `
          <div>
            <p style="margin:0;font-weight:500;font-size:14px;">${s.name}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--ink-soft);">${sub && sub.totalScore ? sub.totalScore : ""}</p>
          </div>
          <span class="status-pill status-${status}">${statusLabels[status]}</span>
        `;
        if (sub) {
          row.addEventListener("click", () => openDetail(s.name, sub));
        } else {
          row.style.cursor = "default";
          row.style.opacity = "0.6";
        }
        listEl.appendChild(row);
      });
    }

    // ---------- 3) تفاصيل تسليم طالب ----------
    function openDetail(studentName, sub) {
      currentSubmission = sub;
      manualGrades = {};
      document.getElementById("detailStudentName").textContent = studentName;
      document.getElementById("detailCard").style.display = "block";
      document.getElementById("detailCard").scrollIntoView({ behavior: "smooth" });

      const wrap = document.getElementById("answersWrap");
      wrap.innerHTML = "";

      (currentWorksheet.exercises || []).forEach((ex, idx) => {
        const ans = (sub.answers || []).find((a) => a.exerciseId === ex.exerciseId);
        const block = document.createElement("div");
        block.className = "answer-block";

        let bodyHtml = "";
        if (ex.type === "open-text") {
          bodyHtml = `
            <p style="font-size:13px;background:var(--paper);border-radius:8px;padding:8px;">${escapeHtml((ans && ans.answer) || "(بدون إجابة)")}</p>
            <div style="margin-top:8px;">
              <button class="grade-btn" data-grade="${ex.exerciseId}" data-val="true">صحيح</button>
              <button class="grade-btn" data-grade="${ex.exerciseId}" data-val="false">خاطئ</button>
            </div>`;
        } else {
          const correctness = ans ? ans.isCorrect : null;
          const badge = correctness === true ? "✓ صحيح" : correctness === false ? "✗ خاطئ" : "— جزئي/غير محدد";
          const badgeColor = correctness === true ? "var(--ok)" : correctness === false ? "var(--bad)" : "var(--ink-soft)";
          bodyHtml = `
            <p style="font-size:13px;background:var(--paper);border-radius:8px;padding:8px;white-space:pre-wrap;">${escapeHtml(JSON.stringify((ans && ans.answer) || "", null, 0))}</p>
            <p style="font-size:12px;color:${badgeColor};font-weight:700;margin-top:6px;">${badge}</p>`;
        }

        block.innerHTML = `
          <p style="margin:0 0 8px;font-weight:700;font-size:13px;color:var(--teal);">تمرين ${idx + 1} — ${typeLabels[ex.type] || ex.type}</p>
          ${bodyHtml}
        `;
        wrap.appendChild(block);
      });

      wrap.querySelectorAll("[data-grade]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const exId = e.target.dataset.grade;
          const val = e.target.dataset.val === "true";
          manualGrades[exId] = val;
          wrap.querySelectorAll(`[data-grade="${exId}"]`).forEach((b) => {
            b.classList.remove("chosen-true", "chosen-false");
          });
          e.target.classList.add(val ? "chosen-true" : "chosen-false");
        });
      });
    }

    document.getElementById("saveGradingBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("gradingStatus");
      statusEl.textContent = "جاري الحفظ...";
      statusEl.style.color = "var(--ink-soft)";

      try {
        const updatedAnswers = (currentSubmission.answers || []).map((a) => {
          if (manualGrades[a.exerciseId] !== undefined) {
            return { ...a, isCorrect: manualGrades[a.exerciseId] };
          }
          return a;
        });

        const correctCount = updatedAnswers.filter((a) => a.isCorrect === true).length;
        const totalCount = updatedAnswers.length;

        await updateDoc(doc(db, "submissions", currentSubmission.id), {
          answers: updatedAnswers,
          status: "corrected",
          totalScore: `${correctCount} من ${totalCount} تمرين`,
          correctedAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        statusEl.textContent = "تم حفظ التصحيح بنجاح.";
        statusEl.style.color = "var(--ok)";
        await selectWorksheet(currentWorksheetId, currentWorksheet);
      } catch (err) {
        statusEl.textContent = "حصل خطأ أثناء الحفظ: " + err.message;
        statusEl.style.color = "var(--bad)";
      }
    });

    function escapeHtml(str) {
      return (str || "").toString().replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("refreshWsBtn").addEventListener("click", loadWorksheets);
  </script>
</body>
</html>
