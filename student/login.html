<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الطالب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  body { display:flex; align-items:center; min-height:100vh; }
  .wrap { max-width:420px; margin:0 auto; padding:40px 20px; width:100%; }
  .title { font-size:24px; font-weight:900; text-align:center; margin:0 0 6px; }
  .subtitle { font-size:14px; color:var(--ink-soft); text-align:center; margin:0 0 24px; }
  .relationship-row { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:10px; cursor:pointer; background:#fff; }
  .relationship-row:active { background:var(--paper); }
  .review-field { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .review-field:last-child { border-bottom:none; }
</style>
</head>
<body>

  <div class="wrap">

    <!-- 1) تسجيل الدخول / إنشاء حساب -->
    <div class="card" id="authCard">
      <h1 class="title">دخول الطالب</h1>
      <p class="subtitle">سجّل دخولك بالبريد الإلكتروني</p>
      <label>البريد الإلكتروني</label>
      <input type="email" id="emailInput" placeholder="example@email.com">
      <br><br>
      <label>كلمة المرور</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
      <br><br>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" id="signinBtn" style="flex:1;">دخول</button>
        <button class="btn btn-secondary" id="signupBtn" style="flex:1;">إنشاء حساب جديد</button>
      </div>
      <p id="authStatus" style="font-size:13px;color:var(--ink-soft);margin-top:10px;text-align:center;"></p>
    </div>

    <!-- 2) إدخال رمز PIN للتفعيل أو ربط معلم جديد -->
    <div class="card" id="pinCard" style="display:none;">
      <h3 style="margin-top:0">أدخل رمز PIN</h3>
      <p style="font-size:13px;color:var(--ink-soft);">الرمز اللي أداك إياه معلمك</p>
      <input type="text" id="pinInput" placeholder="مثال: T1050132" style="font-size:18px;text-align:center;letter-spacing:1px;">
      <br><br>
      <button class="btn btn-primary" id="checkPinBtn" style="width:100%;">تحقق من الرمز</button>
      <p id="pinStatus" style="font-size:13px;color:var(--ink-soft);margin-top:10px;"></p>
    </div>

    <!-- 3) مراجعة وتأكيد البيانات -->
    <div class="card" id="reviewCard" style="display:none;">
      <h3 style="margin-top:0">راجع بياناتك</h3>
      <div id="reviewFields"></div>
      <br>
      <button class="btn btn-primary" id="confirmBtn" style="width:100%;margin-bottom:10px;">البيانات صحيحة</button>
      <button class="btn btn-secondary" id="rejectBtn" style="width:100%;">البيانات مش صح</button>
      <p id="reviewStatus" style="font-size:13px;color:var(--ink-soft);margin-top:10px;text-align:center;"></p>
    </div>

    <!-- 4) اختيار المعلم (لو عنده أكتر من علاقة) -->
    <div class="card" id="pickerCard" style="display:none;">
      <h3 style="margin-top:0">اختر المعلم/المادة</h3>
      <div id="pickerList"></div>
      <button class="btn btn-secondary" id="addAnotherBtn" style="width:100%;margin-top:10px;">إضافة رمز معلم جديد</button>
    </div>

  </div>

  <script type="module">
    import { auth, db } from "../shared/firebase-config.js";
    import {
      createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getRelationshipsForAccount } from "../shared/studentLink.js";

    let currentUser = null;
    let matchedRelDoc = null; // {id, ...data} — العلاقة اللي بنراجعها قبل التفعيل

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      currentUser = user;
      document.getElementById("authCard").style.display = "none";
      await checkAccountAndProceed();
    });

    document.getElementById("signinBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("authStatus");
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      if (!email || !password) {
        statusEl.textContent = "اكتب البريد وكلمة المرور.";
        statusEl.style.color = "var(--bad)";
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        statusEl.textContent = "فشل الدخول: تأكد من البريد وكلمة المرور.";
        statusEl.style.color = "var(--bad)";
      }
    });

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("authStatus");
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      if (!email || !password) {
        statusEl.textContent = "اكتب البريد وكلمة المرور.";
        statusEl.style.color = "var(--bad)";
        return;
      }
      if (password.length < 6) {
        statusEl.textContent = "كلمة المرور لازم تكون 6 أحرف على الأقل.";
        statusEl.style.color = "var(--bad)";
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (err) {
        statusEl.textContent = "حصل خطأ: " + err.message;
        statusEl.style.color = "var(--bad)";
      }
    });

    // ---------- بعد الدخول: نتأكد هل عنده حساب طالب وعلاقات مرتبطة ولا لأ ----------
    async function checkAccountAndProceed() {
      const relationships = await getRelationshipsForAccount(currentUser.uid);

      if (relationships.length === 0) {
        // مفيش أي علاقة مربوطة لسه — لازم يدخل PIN
        document.getElementById("pinCard").style.display = "block";
        return;
      }
      if (relationships.length === 1) {
        selectRelationship(relationships[0]);
        return;
      }
      showPicker(relationships);
    }

    function showPicker(relationships) {
      document.getElementById("pickerCard").style.display = "block";
      const listEl = document.getElementById("pickerList");
      listEl.innerHTML = "جاري التحميل...";

      Promise.all(relationships.map(async (rel) => {
        const teacherQ = query(collection(db, "teachers"), where("code", "==", rel.teacherCode || ""));
        const teacherSnap = await getDocs(teacherQ);
        const teacherName = teacherSnap.empty ? rel.teacherCode : teacherSnap.docs[0].data().name;
        const teacherSubject = teacherSnap.empty ? "" : (teacherSnap.docs[0].data().subject || "");
        return { rel, teacherName, teacherSubject };
      })).then((items) => {
        listEl.innerHTML = "";
        items.forEach(({ rel, teacherName, teacherSubject }) => {
          const row = document.createElement("div");
          row.className = "relationship-row";
          row.innerHTML = `
            <span>${teacherName}${teacherSubject ? " — " + teacherSubject : ""}</span>
            <span style="font-size:12px;color:var(--ink-soft);">اختر ←</span>
          `;
          row.addEventListener("click", () => selectRelationship(rel));
          listEl.appendChild(row);
        });
      });
    }

    function selectRelationship(rel) {
      sessionStorage.setItem("studentId", rel.id);
      sessionStorage.setItem("studentName", rel.name);
      sessionStorage.setItem("studentClassId", rel.currentClassId);
      window.location.href = "worksheets.html";
    }

    document.getElementById("addAnotherBtn").addEventListener("click", () => {
      document.getElementById("pickerCard").style.display = "none";
      document.getElementById("pinCard").style.display = "block";
    });

    // ---------- 2) التحقق من رمز PIN ----------
    document.getElementById("checkPinBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("pinStatus");
      const pin = document.getElementById("pinInput").value.trim();
      if (!pin) {
        statusEl.textContent = "اكتب الرمز أولًا.";
        statusEl.style.color = "var(--bad)";
        return;
      }

      statusEl.textContent = "جاري التحقق...";
      statusEl.style.color = "var(--ink-soft)";

      try {
        const q = query(collection(db, "students"), where("pin", "==", pin));
        const snap = await getDocs(q);

        if (snap.empty) {
          statusEl.textContent = "الرمز غير صحيح — تأكد منه مع معلمك.";
          statusEl.style.color = "var(--bad)";
          return;
        }

        const relDoc = { id: snap.docs[0].id, ...snap.docs[0].data() };

        if (relDoc.studentAccountId && relDoc.studentAccountId === currentUser.uid) {
          // مربوط بالفعل بنفس الحساب الحالي — نكمل مباشرة
          selectRelationship(relDoc);
          return;
        }
        if (relDoc.studentAccountId && relDoc.studentAccountId !== currentUser.uid) {
          statusEl.textContent = "هذا الرمز مُفعَّل بالفعل بحساب تاني. لو نسيت بريدك، اطلب من معلمك إعادة تعيين الرمز.";
          statusEl.style.color = "var(--bad)";
          return;
        }

        // رمز غير مفعّل — نعرض شاشة المراجعة
        matchedRelDoc = relDoc;
        showReview(relDoc);
      } catch (err) {
        statusEl.textContent = "حصل خطأ: " + err.message;
        statusEl.style.color = "var(--bad)";
      }
    });

    // ---------- 3) عرض شاشة المراجعة ----------
    async function showReview(relDoc) {
      document.getElementById("pinCard").style.display = "none";
      document.getElementById("pickerCard").style.display = "none";
      document.getElementById("reviewCard").style.display = "block";

      const classSnap = await getDoc(doc(db, "classes", relDoc.currentClassId));
      const classData = classSnap.exists() ? classSnap.data() : null;
      const classLabel = classData
        ? `${classData.code}${classData.name ? " - " + classData.name : ""}`
        : "—";

      document.getElementById("reviewFields").innerHTML = `
        <div class="review-field"><span>الاسم</span><strong>${relDoc.name}</strong></div>
        <div class="review-field"><span>رقم الهوية</span><strong>${relDoc.nationalId}</strong></div>
        <div class="review-field"><span>الفصل</span><strong>${classLabel}</strong></div>
      `;
    }

    document.getElementById("confirmBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("reviewStatus");
      statusEl.textContent = "جاري التفعيل...";
      statusEl.style.color = "var(--ink-soft)";

      try {
        const accountSnap = await getDoc(doc(db, "studentAccounts", currentUser.uid));
        if (!accountSnap.exists()) {
          await setDoc(doc(db, "studentAccounts", currentUser.uid), {
            name: matchedRelDoc.name,
            currentNationalId: matchedRelDoc.nationalId,
            previousNationalIds: [],
            email: currentUser.email || "",
            createdAt: serverTimestamp()
          });
        }

        await updateDoc(doc(db, "students", matchedRelDoc.id), {
          studentAccountId: currentUser.uid,
          activated: true,
          updatedAt: serverTimestamp()
        });

        selectRelationship(matchedRelDoc);
      } catch (err) {
        statusEl.textContent = "حصل خطأ: " + err.message;
        statusEl.style.color = "var(--bad)";
      }
    });

    document.getElementById("rejectBtn").addEventListener("click", () => {
      document.getElementById("reviewCard").style.display = "none";
      document.getElementById("pinCard").style.display = "block";
      document.getElementById("pinStatus").textContent = "كلّم معلمك يصحح بياناتك، وبعدين جرّب الرمز تاني.";
      document.getElementById("pinStatus").style.color = "var(--bad)";
      matchedRelDoc = null;
    });
  </script>
</body>
</html>
